---
layout: default
---
<div class="post">

    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <p class="meta">{{ page.date | date: "%b %-d, %Y" }}{% if page.author %} • {{ page.author }}{% endif %}{% if
            page.meta %} • {{ page.meta }}{% endif %}</p>
    </header>

    <article class="post-content">
        {{ content }}
    </article>

    <link rel="stylesheet" type="text/css" href="/css/posts/toc.css" />
    <link rel="stylesheet" type="text/css" href="/css/posts/text.css" />
    <link rel="stylesheet" type="text/css" href="/css/posts/code.css" />

    <!-- mathjax -->
    {% if page.mathjax %}
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
    <script type="text/javascript">
        MathJax.Hub.Config({
            tex2jax: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            }
        });
    </script>
    {% endif %}

    <!-- giscus comments -->
    {% if page.comments %}
        {% include comments.html %}
    {% endif %}

</div>
